<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="120">
<title>OIMS Owncrave — Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e8ee; --dim: #8b93a7; --faint: #5b6478;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e1e4e9;
      --fg: #1a1d23; --dim: #5b6478; --faint: #8b93a7;
      --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 {
    font-size: 11px; margin: 0 0 8px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--dim); font-weight: 600;
  }
  h3 { font-size: 12px; margin: 14px 0 4px; color: var(--fg); }
  h3:first-child { margin-top: 0; }
  header {
    display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  header .meta { color: var(--dim); font-size: 12px; }
  header .stamp { margin-left: auto; color: var(--faint); font-size: 11px; }

  .grid { display: grid; gap: 12px; grid-template-columns: 1.55fr 1fr; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px;
  }
  .panel + .panel { margin-top: 12px; }
  .panel.alert { border-color: var(--bad); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--faint); font-weight: 600;
    padding: 0 8px 5px 0; border-bottom: 1px solid var(--line);
  }
  td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.done td { opacity: .45; text-decoration: line-through; }

  .id { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .seq { font-family: var(--mono); color: var(--faint); }
  .note { color: var(--faint); font-size: 11px; }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .s-closed   { background: rgba(63,185,80,.16);  color: var(--ok); }
  .s-open     { background: rgba(139,147,167,.18); color: var(--dim); }
  .s-in_progress { background: rgba(88,166,255,.16); color: var(--accent); }
  .s-none     { background: rgba(248,81,73,.14);  color: var(--bad); }
  .pP1 { color: var(--bad); font-weight: 700; }
  .pP2 { color: var(--warn); }
  .pP3, .pP4 { color: var(--faint); }

  ul.drift { list-style: none; margin: 0; padding: 0; }
  ul.drift li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.drift li:last-child { border-bottom: 0; }
  ul.drift .hint { color: var(--faint); font-size: 11px; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.warn { background: var(--warn); } .dot.info { background: var(--accent); }

  .sesi-wrap { margin: 2px 0 8px; }
  .sesi {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 4px 0; font-size: 12px;
  }
  .sesi code {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    background: rgba(88,166,255,.12); color: var(--accent);
    padding: 2px 6px; border-radius: 4px; white-space: nowrap;
  }
  .sesi code.copy-name { cursor: pointer; }
  .sesi code.copy-name:hover { background: rgba(88,166,255,.24); }
  .sesi code.ok { background: rgba(63,185,80,.16); color: var(--ok); }
  .sesi.done { opacity: .5; }
  .sesi.done code { background: rgba(139,147,167,.13); color: var(--dim); }
  button.copy {
    margin-left: auto; font: inherit; font-size: 11px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px;
  }
  button.copy:hover { border-color: var(--accent); }
  button.copy.ok { color: var(--ok); border-color: var(--ok); }

  .plan-badge {
    display: inline-block; font-size: 10px; font-weight: 600; white-space: nowrap;
    padding: 1px 6px; border-radius: 4px; vertical-align: middle;
    background: rgba(210,153,34,.16); color: var(--warn);
  }
  tr.done .plan-badge { opacity: .5; }

  .empty { color: var(--faint); font-size: 12px; padding: 4px 0; }
  .errbox {
    background: rgba(248,81,73,.1); border: 1px solid var(--bad);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; font-size: 12px;
  }
  .errbox b { color: var(--bad); }
  footer { margin-top: 14px; color: var(--faint); font-size: 11px; }
  code { font-family: var(--mono); background: rgba(139,147,167,.13); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<script>const DATA = {"generated": "2026-09-15 13:22", "today": "Tuesday, 15 September 2026", "errors": ["bd list --json gagal — beads tidak terbaca"], "drift": [], "waves": [], "next_up": [], "done_week": [], "stats": {}, "md": {"updated": "2026-09-15", "version": null}};</script>

<header>
  <h1>OIMS Owncrave</h1>
  <span class="meta" id="today"></span>
  <span class="meta" id="version"></span>
  <span class="stamp" id="stamp"></span>
</header>

<div id="errors"></div>

<div class="grid">
  <div>
    <section class="panel">
      <h2>Urutan rencana (docs/dashboard.md)</h2>
      <div id="waves"></div>
    </section>
  </div>

  <div>
    <section class="panel">
      <h2>Berikutnya</h2>
      <div id="next"></div>
    </section>

    <section class="panel" id="drift-panel">
      <h2>Drift beads ↔ dashboard.md</h2>
      <div id="drift"></div>
    </section>

    <section class="panel">
      <h2>Selesai minggu ini</h2>
      <div id="done"></div>
    </section>

    <section class="panel">
      <h2>Ringkasan beads</h2>
      <div id="stats"></div>
    </section>
  </div>
</div>

<footer>
  Read-only. Sumber: beads (status) · docs/dashboard.md (urutan rencana).
  Regenerate: <code>python3 tools/dashboard/generate.py</code>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function statusPill(s) {
  const cls = { closed: 's-closed', open: 's-open', in_progress: 's-in_progress' }[s] || 's-none';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

// Prompt siap-paste untuk membuka sesi baru sesuai rencana.
function promptFor(se) {
  const ids = se.open_ids.length ? se.open_ids : se.ids;
  return `lanjut eksekusi borongan. Baca memory orchestrator-bulk-exec-mode + `
    + `docs/claude/orchestrator-workflow.md (patuhi aturan berhenti: 1 sesi = 1 gelombang).\n`
    + `Kerjakan: ${ids.join(', ')} — ${se.focus}.\n`
    + `Commit per issue, update panduan review, regenerate dashboard di akhir.`;
}

function sesiBlock(w) {
  const rows = (w.sesi || []).map((se, i) => {
    const cls = se.done ? 'sesi done' : 'sesi';
    // Nama sesi sendiri bisa diklik untuk disalin (buat /rename), terpisah dari prompt.
    const name = se.done
      ? `<code>${esc(se.name)}</code>`
      : `<code class="copy-name" data-w="${w.n}" data-i="${i}" title="klik: salin nama sesi">${esc(se.name)}</code>`;
    const btn = se.done ? '' :
      `<button class="copy" data-w="${w.n}" data-i="${i}">salin prompt</button>`;
    return `<div class="${cls}">
      ${name}
      <span class="note">${esc(se.focus)}</span>
      ${se.done ? '<span class="pill s-closed">selesai</span>' : btn}
    </div>`;
  }).join('');
  const notes = (w.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join('');
  return `<div class="sesi-wrap">${rows}${notes}</div>`;
}

function render(d) {
  if (!d) { document.body.innerHTML = '<p class="errbox">Data kosong — jalankan generator.</p>'; return; }

  $('today').textContent = d.today;
  if (d.md) $('version').textContent = (d.md.version || '') + (d.md.updated ? ' · md ' + d.md.updated : '');
  $('stamp').textContent = 'digenerate ' + d.generated;

  $('errors').innerHTML = (d.errors || []).length
    ? `<div class="errbox"><b>Sumber tidak terbaca:</b> ${d.errors.map(esc).join(' · ')}</div>` : '';

  // urutan rencana per gelombang
  $('waves').innerHTML = (d.waves || []).length ? d.waves.map(w => `
    <h3>Gelombang ${w.n} — ${esc(w.title)}</h3>
    ${sesiBlock(w)}
    <table>
      ${w.items.map(i => `<tr class="${i.status === 'closed' ? 'done' : ''}">
        <td class="seq">${i.seq}</td>
        <td class="id">${esc(i.id)}</td>
        <td>${esc(i.title)}${i.needs_plan ? ' <span class="plan-badge">perlu plan</span>' : ''}<div class="note">${esc(i.note)}</div></td>
        <td class="p${esc(i.prio)}">${esc(i.prio)}</td>
        <td>${statusPill(i.status)}</td>
      </tr>`).join('')}
    </table>`).join('') : '<p class="empty">Tidak ada tabel gelombang di dashboard.md.</p>';

  // berikutnya
  $('next').innerHTML = (d.next_up || []).length ? `<table>
    ${d.next_up.map(i => `<tr>
      <td class="seq">${i.seq}</td>
      <td class="id">${esc(i.id)}</td>
      <td>${esc(i.title)}</td>
      <td>${statusPill(i.status)}</td>
    </tr>`).join('')}
  </table>` : '<p class="empty">Semua rencana selesai 🎉</p>';

  // drift
  const dr = d.drift || [];
  $('drift-panel').className = 'panel' + (dr.some(x => x.level === 'warn') ? ' alert' : '');
  $('drift').innerHTML = dr.length ? `<ul class="drift">${dr.map(x => `
    <li><span class="dot ${esc(x.level)}"></span>${esc(x.what)}
      <div class="hint">${esc(x.hint)}</div></li>`).join('')}</ul>`
    : '<p class="empty">Beads dan dashboard.md sinkron.</p>';

  // selesai minggu ini
  $('done').innerHTML = (d.done_week || []).length ? `<table>
    ${d.done_week.map(x => `<tr>
      <td class="id">${esc(x.date.slice(5))}</td>
      <td><span class="id">${esc(x.id)}</span> ${esc(x.title)}</td>
    </tr>`).join('')}
  </table>` : '<p class="empty">Belum ada yang ditutup minggu ini.</p>';

  // stats
  const st = d.stats || {};
  $('stats').innerHTML = `<table>
    <tr><td>Open</td><td class="seq">${st.open ?? '—'}</td></tr>
    <tr><td>In progress</td><td class="seq">${st.in_progress ?? '—'}</td></tr>
    <tr><td>Closed</td><td class="seq">${st.closed ?? '—'}</td></tr>
    <tr><td>Total</td><td class="seq">${st.total ?? '—'}</td></tr>
  </table>`;
}

render(DATA);

// Salin ke clipboard — fallback textarea karena clipboard API diblokir di file://
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

function flash(el, msg) {
  const old = el.textContent;
  el.textContent = msg; el.classList.add('ok');
  setTimeout(() => { el.textContent = old; el.classList.remove('ok'); }, 1600);
}

function sesiOf(el) {
  const w = (DATA.waves || []).find(x => String(x.n) === el.dataset.w);
  return w && w.sesi[+el.dataset.i];
}

// Dua pemicu: klik nama sesi = salin nama (buat /rename); tombol = salin prompt.
document.addEventListener('click', async e => {
  const nameEl = e.target.closest('.copy-name');
  if (nameEl) {
    const se = sesiOf(nameEl);
    if (!se) return;
    await copyText(se.name);
    flash(nameEl, '✓ nama tersalin');
    return;
  }
  const b = e.target.closest('.copy');
  if (!b) return;
  const se = sesiOf(b);
  if (!se) return;
  await copyText(promptFor(se));
  flash(b, '✓ tersalin');
});
</script>
</body>
</html>
